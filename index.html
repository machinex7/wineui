<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Cellar Notes &mdash; Sign In</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="css/variables.css" />
	<link rel="stylesheet" href="css/base.css" />
	<link rel="stylesheet" href="css/login.css" />
</head>
<body>
	<div class="login-page">
		<div class="login-card card">
			<div class="login-brand">
				<span class="login-brand-icon" aria-hidden="true">&#127863;</span>
				<h1>Cellar Notes</h1>
				<p class="login-tagline">Track the wines and wineries you love.</p>
			</div>

			<form id="login-form" class="login-form" novalidate>
				<div class="field">
					<label for="username">Username</label>
					<input type="text" id="username" name="username" autocomplete="username" placeholder="e.g. testuser" />
				</div>
				<div class="field">
					<label for="password">Password</label>
					<input type="password" id="password" name="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" />
				</div>
				<p id="login-error" class="field-error" role="alert"></p>
				<button type="submit" class="btn btn-primary login-submit">Sign In</button>
			</form>

			<p class="login-hint">Demo credentials: <strong>testuser</strong> / <strong>wine123</strong></p>
		</div>
	</div>

	<script type="module" src="js/login.js"></script>
</body>
</html>
