<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Search Wineries &mdash; Cellar Notes</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="css/variables.css" />
	<link rel="stylesheet" href="css/base.css" />
	<link rel="stylesheet" href="css/search.css" />
</head>
<body>
	<header class="search-topbar">
		<a href="main.html" class="btn-icon-ghost" title="Back" aria-label="Back to main page">&#8592;</a>
		<h1>Search Wineries</h1>
	</header>

	<main class="search-content">
		<form id="search-form" class="search-controls">
			<input
				type="search"
				id="search-input"
				placeholder="Search by winery name, city, or state..."
				aria-label="Search wineries"
			/>
			<button type="button" id="locate-me-btn" class="btn btn-secondary" title="Use my location">&#128205; Near Me</button>
		</form>

		<div id="search-map" class="search-map" aria-label="Map of nearby wineries"></div>

		<ul id="search-results" class="winery-results"></ul>
	</main>

	<script type="module" src="js/search.js"></script>
</body>
</html>
